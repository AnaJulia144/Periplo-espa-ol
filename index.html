<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Periplo-español</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root { --papel:#F4ECDF; --hoja:#FBF7F0; --linea:#E0D1BB; --tinta:#3A2A1F; --suave:#7A6555; --terracota:#B4532F; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px;
           background:var(--papel); background-image:radial-gradient(rgba(58,42,31,.07) 1px,transparent 1px); background-size:18px 18px;
           color:var(--tinta); font-family:"Source Sans 3",system-ui,sans-serif; }
    h1 { font-family:Fraunces,Georgia,serif; font-size:clamp(2.2rem,6vw,3.2rem); margin:0 0 .25rem; }
    h1 span { color:var(--terracota); }
    p { color:var(--suave); margin:0 0 2rem; }
    .opciones { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); max-width:560px; }
    a, .off { display:block; padding:24px; border-radius:14px; background:var(--hoja); border:1px solid var(--linea); text-decoration:none; color:inherit; }
    a:hover { border-color:var(--terracota); }
    b { font-family:Fraunces,Georgia,serif; font-size:1.3rem; display:block; margin-bottom:4px; }
    .off { opacity:.6; border-style:dashed; }
  </style>
</head>
<body>
  <main>
    <h1>Periplo<span>-español</span></h1>
    <p>Español para viajes de trabajo y turismo.</p>
    <div class="opciones">
      <a href="panel/"><b>Panel de maestra</b>Crear y organizar el curso y sus juegos.</a>
      <div class="off"><b>Portal de alumnos</b>Próximamente.</div>
    </div>
  </main>
</body>
</html>
